global:
  scrape_interval: 5s
  evaluation_interval: 5s
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]
rule_files:
  - /etc/prometheus/abrnoc-alerts.yml
scrape_configs:
  - job_name: node
    static_configs:
      - targets: ["127.0.0.1:19100"]
        labels: {role: kvm, region: fra}
  - job_name: libvirt
    static_configs:
      - targets: ["127.0.0.1:19100"]
        labels: {role: kvm, region: fra}
