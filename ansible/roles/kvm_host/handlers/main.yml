---
- name: Restart ssh
  ansible.builtin.service:
    name: ssh
    state: restarted
- name: Reload nftables
  ansible.builtin.service:
    name: nftables
    state: restarted
- name: Restart chrony
  ansible.builtin.service:
    name: chrony
    state: restarted
- name: Restart journald
  ansible.builtin.service:
    name: systemd-journald
    state: restarted
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
